<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - Halaman Tidak Ditemukan</title>
    
    <style>
        /* Reset margin & padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Setup Body untuk Mode Gelap dan Layout ke Tengah */
        body {
            background-color: #0f172a; /* Warna latar belakang gelap (slate) */
            color: #f8fafc; /* Warna teks terang */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Container Utama */
        .error-container {
            max-width: 600px;
            z-index: 10;
        }

        /* Styling Teks 404 Utama */
        .error-code {
            font-size: clamp(6rem, 15vw, 12rem); /* Responsif menyesuaikan layar */
            font-weight: 800;
            line-height: 1;
            margin-bottom: 10px;
            background: linear-gradient(to right, #34d399, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 4s ease-in-out infinite; /* Memanggil animasi melayang */
            text-shadow: 0px 10px 30px rgba(16, 185, 129, 0.2);
        }

        /* Styling Judul dan Deskripsi */
        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Tombol Kembali ke Beranda */
        .btn-home {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #34d399, #059669);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
            background: linear-gradient(135deg, #10b981, #047857);
        }

        .btn-home:active {
            transform: translateY(1px);
        }

        /* Animasi Melayang (Floating) */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        /* Animasi Latar Belakang Lingkaran Bercahaya */
        .glow-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: pulse 3s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.5); }
        }
    </style>
</head>
<body>

    <!-- Elemen dekoratif latar belakang -->
    <div class="glow-circle"></div>

    <!-- Konten Utama Halaman 404 -->
    <div class="error-container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        
        <!-- Tombol Interaktif -->
        <a href="https://www.google.com/" class="btn-home">Kembali ke Beranda</a>
    </div>

</body>
</html>
